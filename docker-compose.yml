services:
  postgres:
    image: postgres:17

    container_name: scms-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scms

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

# Optional MinIO storage is defined in docker-compose.minio.yml.
volumes:
  postgres_data:

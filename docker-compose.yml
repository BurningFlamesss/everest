services:
  postgres:
    image: postgres:17

    container_name: scms-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scms

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # S3-compatible object storage used when STORAGE_DRIVER=s3.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}

    container_name: scms-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-scms}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-scms-secret}

    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
